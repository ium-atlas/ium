name: 사건 제안 / Event Proposal
description: 새 사건 추가 또는 기존 사건 보완을 제안합니다. Suggest a new event or an update to an existing event.
labels: [event-proposal]
body:
  - type: input
    id: topic
    attributes: { label: 주제 / Topic, placeholder: "예 / Example: crusade-1" }
    validations: { required: true }
  - type: input
    id: name
    attributes: { label: 사건명 / Event Name, placeholder: "예 / Example: 아스칼론 전투" }
    validations: { required: true }
  - type: input
    id: date
    attributes: { label: 시기 / Date (YYYY-MM), placeholder: "1099-08" }
    validations: { required: true }
  - type: textarea
    id: perspectives
    attributes:
      label: 관점별 서술과 출처 / Narratives and Sources by Perspective
      description: 관점마다 한 줄 요약과 출처를 적어주세요. 출처 없는 제안은 반려됩니다. Add a one-line summary and source for each perspective. Proposals without sources will be declined.
      placeholder: "eu: ... (출처: ...)\nar: ... (출처: ...)"
    validations: { required: true }
