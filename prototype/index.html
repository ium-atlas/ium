<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IUM — 프로토타입 v3</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; overflow:hidden; }
  #map { position:absolute; inset:0; }
  .hide { display:none !important; }

  /* 상단 바 */
  #topbar { position:absolute; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; gap:14px; padding:12px 20px;
    background:linear-gradient(rgba(15,18,25,.92),rgba(15,18,25,.75) 70%,transparent); color:#fff; pointer-events:none; }
  #topbar > * { pointer-events:auto; }
  #logo { font-size:18px; font-weight:800; letter-spacing:1px; cursor:pointer; }
  #logo small { font-weight:400; color:#9ab; margin-left:8px; font-size:12px; }
  #back { border:0; background:rgba(255,255,255,.1); color:#e8edf2; padding:7px 14px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; }
  #layers { display:flex; gap:6px; background:rgba(255,255,255,.08); border-radius:10px; padding:5px 8px; }
  .lay { display:flex; align-items:center; gap:6px; color:#cdd6e0; font-size:13px; font-weight:600;
    padding:5px 10px; border-radius:7px; cursor:pointer; user-select:none; border:1px solid transparent; }
  .lay .sw { width:12px; height:12px; border-radius:50%; }
  .lay.on { background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.18); }
  .lay.off { opacity:.38; }
  #hint { font-size:12px; color:#9ab; }

  /* 주제 카드 (지도 마커) */
  .tcard { width:178px; background:rgba(15,18,25,.93); color:#e8edf2; border:1px solid rgba(255,255,255,.18);
    border-radius:11px; padding:10px 12px; cursor:pointer; transition:transform .15s, border-color .15s; }
  .tcard:hover { transform:scale(1.05); border-color:#e8b44a; }
  .tcard .tt { font-size:13.5px; font-weight:700; }
  .tcard .tp { font-size:11px; color:#9ab; margin:2px 0 6px; }
  .tcard .tb { display:flex; gap:3px; align-items:center; }
  .tcard .tb i { display:block; height:5px; border-radius:3px; }
  .tcard .badge { display:inline-block; margin-top:6px; font-size:10.5px; color:#e8b44a; }
  .tcard.soon { border-style:dashed; opacity:.55; cursor:default; }
  .tcard.soon:hover { transform:none; border-color:rgba(255,255,255,.18); }
  .tcard.soon .badge { color:#7a8a9a; }

  /* 연대기 */
  #chron { position:absolute; top:64px; left:0; bottom:130px; width:268px; z-index:9;
    background:rgba(15,18,25,.92); color:#e8edf2; border-radius:0 14px 14px 0; display:flex; flex-direction:column; }
  #chron h3 { font-size:11px; color:#9ab; letter-spacing:2px; padding:14px 16px 8px; text-transform:uppercase; }
  #chron-list { overflow-y:auto; flex:1; padding:0 8px 12px; }
  .ce { padding:9px 10px; border-radius:9px; cursor:pointer; margin:2px 0; border-left:3px solid transparent; transition:all .2s; }
  .ce .cd { font-size:11px; color:#e8b44a; font-weight:700; font-variant-numeric:tabular-nums; }
  .ce .cn { font-size:13px; font-weight:600; margin:2px 0 4px; line-height:1.35; }
  .ce .cw { display:flex; gap:3px; align-items:center; height:6px; }
  .ce .cw i { display:block; height:5px; border-radius:3px; }
  .ce.future { opacity:.28; }
  .ce.now { background:rgba(232,180,74,.13); border-left-color:#e8b44a; }
  .ce:hover { background:rgba(255,255,255,.07); }

  /* 사이드 패널 */
  #panel { position:absolute; top:64px; right:0; bottom:130px; width:380px; z-index:9;
    background:rgba(15,18,25,.94); color:#e8edf2; border-radius:14px 0 0 14px;
    transform:translateX(100%); transition:transform .25s; display:flex; flex-direction:column; }
  #panel.open { transform:translateX(0); }
  #panel-head { padding:18px 20px 12px; border-bottom:1px solid rgba(255,255,255,.08); }
  #panel-close { position:absolute; top:12px; right:14px; background:none; border:0; color:#9ab; font-size:18px; cursor:pointer; }
  #ev-date { font-size:12px; color:#e8b44a; font-weight:700; }
  #ev-title { font-size:19px; font-weight:800; margin:4px 0 2px; }
  #gauge { padding:14px 20px; border-bottom:1px solid rgba(255,255,255,.08); }
  #gauge h4 { font-size:11px; color:#9ab; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
  .grow { display:flex; align-items:center; gap:8px; margin:6px 0 0; font-size:12px; }
  .grow span.lab { width:72px; color:#cdd6e0; }
  .gbar { flex:1; height:8px; background:rgba(255,255,255,.08); border-radius:4px; overflow:hidden; }
  .gfill { height:100%; border-radius:4px; transition:width .4s; }
  .grow span.val { width:28px; text-align:right; color:#9ab; }
  .gname { font-size:11px; color:#7a8a9a; margin:1px 0 4px 80px; }
  #tabs { display:flex; border-bottom:1px solid rgba(255,255,255,.08); }
  .tab { flex:1; padding:10px 4px; background:none; border:0; color:#9ab; font-size:12.5px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; }
  .tab.on { color:#e8b44a; border-bottom-color:#e8b44a; }
  #narr { padding:16px 20px; overflow-y:auto; flex:1; font-size:13.5px; line-height:1.7; color:#cdd6e0; }
  #narr .src { margin-top:12px; font-size:11px; color:#7a8a9a; border-top:1px dashed rgba(255,255,255,.1); padding-top:8px; }
  .placeholder { color:#67788a; font-style:italic; }

  /* 하단 공통 */
  .botbar { position:absolute; left:0; right:0; bottom:0; z-index:10; padding:14px 24px 18px;
    background:linear-gradient(transparent,rgba(15,18,25,.85) 30%,rgba(15,18,25,.95)); color:#fff; }

  /* 주제 타임라인 */
  #tl-top { display:flex; align-items:center; gap:14px; margin-bottom:4px; }
  #play { width:38px; height:38px; border-radius:50%; border:0; background:#e8b44a; color:#1a1408; font-size:15px; cursor:pointer; flex-shrink:0; }
  #cur-date { font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; min-width:96px; }
  #cur-event { font-size:12.5px; color:#e8b44a; }
  #track { position:relative; height:14px; }
  .tm { position:absolute; top:2px; width:8px; height:8px; border-radius:50%; background:#e8b44a;
    border:1.5px solid #1a1408; transform:translateX(-50%); cursor:pointer; }
  .tm.future { background:#5a6678; }
  .tm:hover::after { content:attr(data-n); position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    background:#1a1f2a; color:#e8edf2; font-size:11px; padding:4px 8px; border-radius:6px; white-space:nowrap; }
  #slider { width:100%; accent-color:#e8b44a; cursor:pointer; display:block; }
  #tl-labels { display:flex; justify-content:space-between; font-size:11px; color:#9ab; margin-top:2px; }

  /* 아이콘 범례 */
  #iconlegend { position:absolute; left:282px; bottom:140px; z-index:8; display:flex; gap:10px;
    background:rgba(15,18,25,.85); color:#cdd6e0; padding:7px 12px; border-radius:9px; font-size:11px; align-items:center; }
  #iconlegend span { display:flex; align-items:center; gap:4px; }

  /* 홈 시대 필터 */
  #era-chips { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; align-items:center; }
  .chip { border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.06); color:#cdd6e0;
    font-size:12px; font-weight:600; padding:5px 12px; border-radius:20px; cursor:pointer; }
  .chip:hover, .chip.on { background:#e8b44a; color:#1a1408; border-color:#e8b44a; }
  #era-inputs { margin-left:auto; display:flex; gap:6px; align-items:center; font-size:12px; color:#9ab; }
  #era-inputs input { width:74px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
    color:#e8edf2; border-radius:7px; padding:5px 8px; font-size:12px; }
  #dual { position:relative; height:26px; }
  #dual .rail { position:absolute; top:11px; left:0; right:0; height:5px; background:rgba(255,255,255,.12); border-radius:3px; }
  #dual .fill { position:absolute; top:11px; height:5px; background:#e8b44a; border-radius:3px; }
  #dual input[type=range] { position:absolute; top:0; left:0; width:100%; height:26px; -webkit-appearance:none; appearance:none;
    background:transparent; pointer-events:none; margin:0; }
  #dual input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; pointer-events:auto;
    width:18px; height:18px; border-radius:50%; background:#fff; border:3px solid #e8b44a; cursor:grab; }
  #dual input[type=range]::-moz-range-thumb { pointer-events:auto; width:14px; height:14px; border-radius:50%;
    background:#fff; border:3px solid #e8b44a; cursor:grab; }
  #era-labels { display:flex; justify-content:space-between; font-size:11px; color:#9ab; margin-top:2px; }
  #era-sel { text-align:center; font-size:13px; margin-top:6px; color:#e8b44a; font-weight:700; }
</style>
</head>
<body>
<div id="map"></div>

<div id="topbar">
  <div id="logo">IUM<small id="crumb">세계 — 시대를 골라 역사를 펼쳐보세요</small></div>
  <button id="back" class="hide">← 세계지도</button>
  <div id="layers" class="hide"></div>
  <div id="hint" class="hide">원의 크기 = 그 관점에서의 비중</div>
</div>

<div id="iconlegend" class="hide"></div>

<div id="chron" class="hide">
  <h3>연대기 — 시대순</h3>
  <div id="chron-list"></div>
</div>

<div id="panel">
  <div id="panel-head">
    <button id="panel-close">✕</button>
    <div id="ev-date"></div>
    <div id="ev-title"></div>
  </div>
  <div id="gauge"><h4>관점별 비중 · 명칭</h4><div id="gauge-rows"></div></div>
  <div id="tabs"></div>
  <div id="narr"></div>
</div>

<!-- 홈: 시대 필터 -->
<div id="homebar" class="botbar">
  <div id="era-chips">
    <button class="chip on" data-r="-3000,2030">전체</button>
    <button class="chip" data-r="-3000,500">고대</button>
    <button class="chip" data-r="500,1500">중세</button>
    <button class="chip" data-r="1000,1100">11세기</button>
    <button class="chip" data-r="1200,1300">13세기</button>
    <button class="chip" data-r="1500,1600">16세기</button>
    <button class="chip" data-r="1800,1900">19세기</button>
    <button class="chip" data-r="1900,2000">20세기</button>
    <div id="era-inputs">
      정확한 연도 <input type="number" id="ylo" value="-3000" step="10" title="음수 = 기원전">–<input type="number" id="yhi" value="2030" step="10">
    </div>
  </div>
  <div id="dual">
    <div class="rail"></div><div class="fill" id="fill"></div>
    <input type="range" id="rlo" min="-3000" max="2030" step="10" value="-3000">
    <input type="range" id="rhi" min="-3000" max="2030" step="10" value="2030">
  </div>
  <div id="era-labels"><span>← 기원전 3000</span><span>BC 1000</span><span>0</span><span>1000</span><span>현재 →</span></div>
  <div id="era-sel"></div>
</div>

<!-- 주제: 타임라인 -->
<div id="timeline" class="botbar hide">
  <div id="tl-top">
    <button id="play">▶</button>
    <div id="cur-date"></div>
    <div id="cur-event"></div>
  </div>
  <div id="track"></div>
  <input type="range" id="slider" min="0" max="44" value="0" step="1">
  <div id="tl-labels"><span id="tl-l"></span><span id="tl-r"></span></div>
</div>

const PALETTE = ['#4a90d9','#3eb489','#b06ad9','#e8884a','#d94a4a','#d9c44a','#5dc4d9','#d96aa8'];
let terrOn = true, terrYearLoaded = null, terrReq = 0;
const terrCache = {};
const hashCol = s => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
function terrSnapshot() {
  const year = Math.floor((m0 + cur) / 12);
  let pick = T.terr[0];
  T.terr.forEach(y => { if (y <= year) pick = y; });
  return pick;
}
async function updateTerr() {
  if (!T || !T.terr || !terrOn || !map.getSource('terr')) return;
  const y = terrSnapshot();
  if (y === terrYearLoaded) return;
  const req = ++terrReq;
  if (!terrCache[y]) {
    try {
      const r = await fetch(`https://raw.githubusercontent.com/aourednik/historical-basemaps/master/geojson/world_${y}.geojson`);
      if (!r.ok) throw 0;
      const gj = await r.json();
      gj.features.forEach(f => {
        const n = f.properties.NAME || f.properties.name || '';
        f.properties._n = n; f.properties._c = hashCol(n);
      });
      terrCache[y] = gj;
    } catch (e) { return; }
  }
  if (req !== terrReq || !map.getSource('terr')) return;
  map.getSource('terr').setData(terrCache[y]);
  terrYearLoaded = y;
  document.getElementById('hint').textContent = `원의 크기 = 관점 비중 · 영토는 ${y}년경 기준 (근사치, 클릭하면 이름)`;
}

      `<i style="width:${6 + avgW(t, p.c) * 0.55}px;background:${p.color}"></i>`).join('');
    const spread = t.ready ? Math.max(...t.persps.map(p=>avgW(t,p.c))) - Math.min(...t.persps.map(p=>avgW(t,p.c))) : 0;
    d.innerHTML = `<div class="tt">${t.title}</div><div class="tp">${t.sub}${t.ready ? ' · 관점 ' + t.persps.length : ''}</div>
      <div class="tb">${bars}</div>
      <div class="badge">${t.ready ? (spread >= 30 ? '비대칭 지수 높음 ★' : '비대칭 보통') : '준비 중'}</div>`;
    if (t.ready) d.onclick = () => enterTopic(t);
    const mk = new maplibregl.Marker({ element: d, anchor: 'center' }).setLngLat(t.card).addTo(map);
    markers.push({ t, mk, el: d });
  });
}

// ───────── 시대 필터 (듀얼 슬라이더)
const rlo = document.getElementById('rlo'), rhi = document.getElementById('rhi');
const ylo = document.getElementById('ylo'), yhi = document.getElementById('yhi');
function eraApply(noChip) {
  let lo = +rlo.value, hi = +rhi.value;
  if (lo > hi) [lo, hi] = [hi, lo];
  ylo.value = lo; yhi.value = hi;
  const p = v => (v + 3000) / 5030 * 100;
  const f = document.getElementById('fill');
  f.style.left = p(lo) + '%'; f.style.width = (p(hi) - p(lo)) + '%';
  document.getElementById('era-sel').textContent = `${fmtY(lo)} – ${fmtY(hi)} 시대의 주제를 보는 중`;
  markers.forEach(({ t, el }) => {
    el.style.display = (t.period[1] >= lo && t.period[0] <= hi) ? '' : 'none';
  });
  if (!noChip) document.querySelectorAll('.chip').forEach(c => {
    const [a, b] = c.dataset.r.split(',').map(Number);
    c.classList.toggle('on', a === lo && b === hi);
  });
}
rlo.oninput = () => eraApply(); rhi.oninput = () => eraApply();
ylo.onchange = () => { rlo.value = Math.max(-3000, Math.min(2030, +ylo.value)); eraApply(); };
yhi.onchange = () => { rhi.value = Math.max(-3000, Math.min(2030, +yhi.value)); eraApply(); };
document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  const [a, b] = c.dataset.r.split(',').map(Number);
  rlo.value = a; rhi.value = b; eraApply();
});

// ───────── 주제 진입/이탈
function enterTopic(t) {
  mode = 'topic'; T = t;
  m0 = ami(t.start); total = ami(t.end) - m0; cur = 0;
  terrOn = true; terrYearLoaded = null;
  enabled = {}; t.persps.forEach(p => enabled[p.c] = true);
  tab = t.persps[0].c;
  markers.forEach(m => m.el.style.display = 'none');
  document.getElementById('homebar').classList.add('hide');
  ['timeline', 'chron', 'layers', 'hint'].forEach(i => document.getElementById(i).classList.remove('hide'));
  document.getElementById('back').classList.remove('hide');
  document.getElementById('crumb').textContent = t.title + ' ' + t.sub;
  document.getElementById('slider').max = total;
  document.getElementById('tl-l').textContent = fmtM(m0) + ' ' + t.events[0].name;
  document.getElementById('tl-r').textContent = fmtM(m0 + total) + ' ' + t.events[t.events.length - 1].name;
  buildLayerBtns(); buildTabs(); buildGaugeRows(); buildChron(); buildTrack();
  const used = [...new Set(t.events.map(e => EVTYPE[e.id] || 'political'))];
  document.getElementById('iconlegend').innerHTML =
    used.map(k => `<span>${iconSVG(k, 13, '#cdd6e0')}${ICONS[k].label}</span>`).join('');
  document.getElementById('iconlegend').classList.remove('hide');
  addMapLayers();
  map.fitBounds(t.bounds, { duration: 2200 });
  refresh();
}
function exitTopic() {
  stopPlay(); closePanel();
  removeMapLayers();
  mode = 'home'; T = null;
  ['timeline', 'chron', 'layers', 'hint', 'iconlegend'].forEach(i => document.getElementById(i).classList.add('hide'));
  document.getElementById('back').classList.add('hide');
  document.getElementById('homebar').classList.remove('hide');
  document.getElementById('crumb').textContent = '세계 — 시대를 골라 역사를 펼쳐보세요';
  eraApply(true);
  map.flyTo({ center: [60, 35], zoom: 1.7, duration: 2000 });
}
document.getElementById('back').onclick = exitTopic;
document.getElementById('logo').onclick = () => { if (mode === 'topic') exitTopic(); };

// ───────── 지도 레이어
const radiusExpr = c => ['interpolate', ['linear'], ['get', 'w_' + c], 0, 2, 100, 24];
function routeGeo() {
  return { type: 'FeatureCollection', features: T.routes.map(r => {
    const c = r.pts.filter(p => ami(p[2]) - m0 <= cur).map(p => [p[0], p[1]]);
    return { type: 'Feature', properties: { color: r.color }, geometry: { type: 'LineString', coordinates: c.length > 1 ? c : [] } };
  }) };
}
function eventGeo() {
  return { type: 'FeatureCollection', features: T.events.map(e => {
    const props = { id: e.id, m: ami(e.date) - m0, type: EVTYPE[e.id] || 'political' };
    T.persps.forEach(p => props['w_' + p.c] = e.w[p.c] || 0);
    return { type: 'Feature', properties: props, geometry: { type: 'Point', coordinates: [e.lng, e.lat] } };
  }) };
}
function addMapLayers() {
  map.addSource('terr', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'terr-fill', type: 'fill', source: 'terr',
    paint: { 'fill-color': ['get', '_c'], 'fill-opacity': .14 } });
  map.addLayer({ id: 'terr-line', type: 'line', source: 'terr',
    paint: { 'line-color': '#5a6678', 'line-width': .8, 'line-opacity': .6 } });
  map.on('click', 'terr-fill', e => {
    const evLayers = T.persps.map(p => 'ev-' + p.c).filter(l => map.getLayer(l));
    if (map.queryRenderedFeatures(e.point, { layers: evLayers }).length) return;
    new maplibregl.Popup({ closeButton: false })
      .setLngLat(e.lngLat)
      .setHTML(`<b>${e.features[0].properties._n || '(이름 없음)'}</b> · ${terrYearLoaded}년경`)
      .addTo(map);
  });
  map.addSource('routes', { type: 'geojson', data: routeGeo() });
  map.addLayer({ id: 'routes', type: 'line', source: 'routes',
    paint: { 'line-color': ['get', 'color'], 'line-width': 3, 'line-opacity': .85 },
    layout: { 'line-cap': 'round', 'line-join': 'round' } });
  map.addSource('events', { type: 'geojson', data: eventGeo() });
  T.persps.forEach(p => {
    map.addLayer({ id: 'ev-' + p.c, type: 'circle', source: 'events',
      filter: ['all', ['<=', ['get', 'm'], cur], ['>=', ['get', 'w_' + p.c], MIN_W]],
      paint: { 'circle-radius': radiusExpr(p.c), 'circle-color': p.color,
        'circle-opacity': .28, 'circle-stroke-width': 1.6, 'circle-stroke-color': p.color, 'circle-stroke-opacity': .9 } });
    map.on('click', 'ev-' + p.c, e => openPanel(T.events.find(x => x.id === e.features[0].properties.id)));
    map.on('mouseenter', 'ev-' + p.c, () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'ev-' + p.c, () => map.getCanvas().style.cursor = '');
  });
  map.addLayer({ id: 'ev-ic', type: 'symbol', source: 'events',
    filter: ['<=', ['get', 'm'], cur],
    layout: { 'icon-image': ['concat', 'ic-', ['get', 'type']], 'icon-size': 0.5,
      'icon-allow-overlap': true, 'icon-ignore-placement': true } });
  map.on('click', 'ev-ic', e => openPanel(T.events.find(x => x.id === e.features[0].properties.id)));
}
function removeMapLayers() {
  if (!map.getSource('routes')) return;
  T.persps.forEach(p => map.getLayer('ev-' + p.c) && map.removeLayer('ev-' + p.c));
  map.getLayer('ev-ic') && map.removeLayer('ev-ic');
  map.removeLayer('routes');
  ['terr-fill', 'terr-line'].forEach(l => map.getLayer(l) && map.removeLayer(l));
  map.removeSource('events'); map.removeSource('routes');
  map.getSource('terr') && map.removeSource('terr');
  terrYearLoaded = null;
}

// ───────── 동적 UI 빌드
function buildLayerBtns() {
  const box = document.getElementById('layers');
  box.innerHTML = '';
  T.persps.forEach(p => {
    const d = document.createElement('div');
    d.className = 'lay on';
    d.innerHTML = `<span class="sw" style="background:${p.color}"></span>${p.label}`;
    d.onclick = () => {
      enabled[p.c] = !enabled[p.c];
      d.classList.toggle('on', enabled[p.c]); d.classList.toggle('off', !enabled[p.c]);
      if (map.getLayer('ev-' + p.c)) map.setLayoutProperty('ev-' + p.c, 'visibility', enabled[p.c] ? 'visible' : 'none');
      buildChron(); updateChron();
    };
    box.appendChild(d);
  });
  if (T.terr) {
    const tg = document.createElement('div');
    tg.className = 'lay' + (terrOn ? ' on' : ' off');
    tg.innerHTML = `<span class="sw" style="background:#5a6678"></span>영토`;
    tg.onclick = () => {
      terrOn = !terrOn;
      tg.classList.toggle('on', terrOn); tg.classList.toggle('off', !terrOn);
      ['terr-fill', 'terr-line'].forEach(l => map.getLayer(l) && map.setLayoutProperty(l, 'visibility', terrOn ? 'visible' : 'none'));
      if (terrOn) updateTerr();
    };
    box.appendChild(tg);
  }
}
function buildTabs() {
  const box = document.getElementById('tabs');
  box.innerHTML = '';
  T.persps.forEach(p => {
    const b = document.createElement('button');
    b.className = 'tab' + (p.c === tab ? ' on' : ''); b.textContent = p.label; b.dataset.c = p.c;
    b.onclick = () => { tab = p.c; if (openEv) openPanel(openEv); };
    box.appendChild(b);
  });
}
function buildGaugeRows() {
  const box = document.getElementById('gauge-rows');
  box.innerHTML = '';
  T.persps.forEach(p => {
    box.insertAdjacentHTML('beforeend',
      `<div id="gr-${p.c}"><div class="grow"><span class="lab">${p.label}</span><div class="gbar"><div class="gfill" id="g-${p.c}" style="background:${p.color}"></div></div><span class="val" id="gv-${p.c}"></span></div><div class="gname" id="gn-${p.c}"></div></div>`);
  });
}
function buildChron() {
  const box = document.getElementById('chron-list');
  box.innerHTML = '';
  T.events.forEach(e => {
    const d = document.createElement('div');
    d.className = 'ce'; d.id = 'ce-' + e.id;
    const bars = T.persps.filter(p => (e.w[p.c] || 0) >= MIN_W).map(p =>
      `<i style="width:${4 + (e.w[p.c] || 0) * 0.45}px;background:${p.color};opacity:${enabled[p.c] ? 1 : .15}"></i>`).join('');
    const tp = EVTYPE[e.id] || 'political';
    d.innerHTML = `<div class="cd">${fmtM(ami(e.date))} <span style="color:#7a8a9a;font-weight:400">· ${ICONS[tp].label}</span></div>
      <div class="cn" style="display:flex;align-items:center;gap:6px">${iconSVG(tp, 14, '#9ab3c4')}<span>${e.name}</span></div><div class="cw">${bars}</div>`;
    d.onclick = () => { const m = ami(e.date) - m0; if (m > cur) { cur = m; refresh(); } focusCamera([e], 5.5); openPanel(e); };
    box.appendChild(d);
  });
}
function updateChron() {
  T.events.forEach(e => {
    const el = document.getElementById('ce-' + e.id), m = ami(e.date) - m0;
    el.classList.toggle('future', m > cur);
    el.classList.toggle('now', m === cur);
    if (m === cur) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
}
function buildTrack() {
  const t = document.getElementById('track');
  t.innerHTML = '';
  T.events.forEach(e => {
    const m = ami(e.date) - m0, d = document.createElement('div');
    d.className = 'tm'; d.id = 'tm-' + e.id;
    d.style.left = (m / total * 100) + '%';
    d.dataset.n = `${fmtM(ami(e.date))} ${e.name}`;
    d.onclick = () => { cur = m; refresh(); openPanel(e); };
    t.appendChild(d);
  });
}
function updateTrack() {
  T.events.forEach(e => document.getElementById('tm-' + e.id).classList.toggle('future', ami(e.date) - m0 > cur));
}

// ───────── 갱신
function refresh() {
  document.getElementById('cur-date').textContent = fmtM(m0 + cur);
  document.getElementById('slider').value = cur;
  document.getElementById('cur-event').textContent = T.events.filter(e => ami(e.date) - m0 === cur).map(e => e.name).join(' · ');
  updateChron(); updateTrack();
  if (!map.getSource('routes')) return;
  map.getSource('routes').setData(routeGeo());
  T.persps.forEach(p => map.setFilter('ev-' + p.c, ['all', ['<=', ['get', 'm'], cur], ['>=', ['get', 'w_' + p.c], MIN_W]]));
  map.getLayer('ev-ic') && map.setFilter('ev-ic', ['<=', ['get', 'm'], cur]);
  updateTerr();
}

// ───────── 패널
function openPanel(ev) {
  openEv = ev;
  document.getElementById('panel').classList.add('open');
  document.getElementById('ev-date').textContent = fmtM(ami(ev.date));
  document.getElementById('ev-title').textContent = ev.name;
  T.persps.forEach(p => {
    const has = (ev.w[p.c] || 0) >= MIN_W;
    document.getElementById('gr-' + p.c).style.display = has ? '' : 'none';
    document.getElementById('g-' + p.c).style.width = (ev.w[p.c] || 0) + '%';
    document.getElementById('gv-' + p.c).textContent = ev.w[p.c] || 0;
    document.getElementById('gn-' + p.c).textContent = ev.names[p.c] || '';
  });
  const vis = T.persps.filter(p => (ev.w[p.c] || 0) >= MIN_W);
  if (!vis.find(p => p.c === tab) && vis.length) tab = vis[0].c;
  document.querySelectorAll('.tab').forEach(b => {
    b.style.display = (ev.w[b.dataset.c] || 0) >= MIN_W ? '' : 'none';
    b.classList.toggle('on', b.dataset.c === tab);
  });
  const n = ev.narr[tab], s = (ev.src || {})[tab];
  document.getElementById('narr').innerHTML =
    (!n || n === 'placeholder' ? '<span class="placeholder">[ 서술 준비 중 — 데이터 구축 단계에서 사료 기반 서술이 들어갈 자리 ]</span>' : n) +
    (s ? `<div class="src">출처: ${s}</div>` : '');
}
function closePanel() { document.getElementById('panel').classList.remove('open'); openEv = null; }
document.getElementById('panel-close').onclick = closePanel;

// ───────── 카메라: 인접 사건 클러스터로 줌
function focusCamera(list, clickZoom) {
  if (!list.length) return;
  const e0 = list[0];
  const near = T.events.filter(e => ami(e.date) - m0 <= cur &&
    Math.abs(e.lng - e0.lng) < 6 && Math.abs(e.lat - e0.lat) < 6);
  if (near.length >= 2) {
    const lngs = near.map(e => e.lng), lats = near.map(e => e.lat);
    map.fitBounds([[Math.min(...lngs) - 1.5, Math.min(...lats) - 1.5],
                   [Math.max(...lngs) + 1.5, Math.max(...lats) + 1.5]],
      { duration: 850, maxZoom: 6.5, padding: 80 });
  } else {
    map.flyTo({ center: [e0.lng, e0.lat], zoom: clickZoom || Math.max(map.getZoom(), 4.8), duration: 850 });
  }
}

// ───────── 타임라인 조작
document.getElementById('slider').oninput = e => { cur = +e.target.value; refresh(); };
function stopPlay() { playing = false; document.getElementById('play').textContent = '▶'; clearInterval(timer); }
document.getElementById('play').onclick = () => {
  if (playing) return stopPlay();
  playing = true;
  document.getElementById('play').textContent = '❚❚';
  if (cur >= total) cur = 0;
  const step = Math.max(1, Math.round(total / 80));
  timer = setInterval(() => {
    if (cur >= total) { stopPlay(); map.fitBounds(T.bounds, { duration: 1500 }); return; }
    const prev = cur;
    cur = Math.min(total, cur + step); refresh();
    focusCamera(T.events.filter(e => { const m = ami(e.date) - m0; return m > prev && m <= cur; }));
  }, 400);
};

// ───────── 시작
map.on('load', () => { loadIcons(); buildCards(); eraApply(); });
</script>
